# GitLab CI for PyrA: Linux builds and headless tests of the two viewers.
#
# Every push runs web-linux (Qt-free pyra_web_test) and gui-linux (Qt viewer,
# offscreen). A tag additionally packs the web viewer, uploads it to the
# project's Generic Package Registry and creates a GitLab Release.
# Real-slide, browser and Windows checks stay manual (see the READMEs).

stages:
  - test
  - package
  - release

variables:
  DEBIAN_FRONTEND: noninteractive
  DEPS_DIR: "$CI_PROJECT_DIR/.deps"
  JPEG_PREFIX: "$CI_PROJECT_DIR/.deps/jpeg"
  # bootstrap_jpeg.sh keeps its download and build tree under XDG_CACHE_HOME.
  XDG_CACHE_HOME: "$CI_PROJECT_DIR/.deps/cache"
  HTTPLIB_DIR: "$CI_PROJECT_DIR/.deps/httplib"
  HTTPLIB_VERSION: "v0.36.0"
  # SHA-256 of the upstream v0.36.0 httplib.h. The copy in the dependency ZIP
  # (tests/gui/web/README.md) is re-indented and patched, so its hash differs.
  HTTPLIB_SHA256: "3109704d51dd0919429a270993dd959c6034ce998aeae5280c5a5620433f3306"
  BUNDLE: "pyra_web_test-linux-x64.tar.gz"
  PACKAGE_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/pyra_web_test/$CI_COMMIT_TAG/pyra_web_test-linux-x64.tar.gz"

# Shared Ubuntu 24.04 build: system TIFF/OpenJPEG, JPEG 3.x from the checked
# bootstrap (Ubuntu's 2.x is too old), cached across pipelines.
.linux-build:
  stage: test
  image: ubuntu:24.04
  cache:
    key: jpeg-3.1.3-ubuntu-24.04
    paths:
      - .deps/jpeg/
      - .deps/cache/
  before_script:
    - apt-get update -qq
    - >-
      apt-get install -y -qq --no-install-recommends
      build-essential cmake ninja-build nasm curl ca-certificates
      libtiff-dev libopenjp2-7-dev $EXTRA_PACKAGES
    - test -f "$JPEG_PREFIX/lib/libjpeg.so.8" || bash tests/gui/bootstrap_jpeg.sh "$JPEG_PREFIX"
  script:
    - |
      cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_LIBDIR=lib -DPYRA_ENABLE_AVX2=OFF \
        -DJPEG_INCLUDE_DIR="$JPEG_PREFIX/include" \
        -DJPEG_LIBRARY="$JPEG_PREFIX/lib/libjpeg.so" \
        -DCMAKE_BUILD_RPATH="$JPEG_PREFIX/lib" \
        '-DCMAKE_INSTALL_RPATH=$ORIGIN' \
        $PYRA_OPTIONS
    # The install RPATH $ORIGIN lets an installed libpyra find a bundled libjpeg
    # beside itself (pyra_web_test sets its own $ORIGIN/../lib).
    - cmake --build build --parallel "$(nproc)"
    - ctest --test-dir build --output-on-failure --output-junit "$CI_PROJECT_DIR/junit.xml"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml

web-linux:
  extends: .linux-build
  variables:
    EXTRA_PACKAGES: "nodejs"
    PYRA_OPTIONS: "-DPYRA_BUILD_GUI_TEST=OFF -DPYRA_BUILD_WEB_TEST=ON -DPYRA_HTTPLIB_DIR=$HTTPLIB_DIR"
  before_script:
    - !reference [.linux-build, before_script]
    - mkdir -p "$HTTPLIB_DIR"
    - curl -fsSL --retry 3 -o "$HTTPLIB_DIR/httplib.h" "https://raw.githubusercontent.com/yhirose/cpp-httplib/$HTTPLIB_VERSION/httplib.h"
    - curl -fsSL --retry 3 -o "$HTTPLIB_DIR/LICENSE" "https://raw.githubusercontent.com/yhirose/cpp-httplib/$HTTPLIB_VERSION/LICENSE"
    - echo "$HTTPLIB_SHA256  $HTTPLIB_DIR/httplib.h" | sha256sum --check
  script:
    - !reference [.linux-build, script]
    - cmake --install build --prefix "$CI_PROJECT_DIR/install"
    # Ship JPEG 3.x and its notices: the target's system libjpeg is 2.x.
    - cp -a "$JPEG_PREFIX"/lib/libjpeg.so* install/lib/
    - mkdir -p install/share/Pyra/libjpeg-turbo
    - cp "$JPEG_PREFIX"/share/doc/libjpeg-turbo/LICENSE.md "$JPEG_PREFIX"/share/doc/libjpeg-turbo/README.ijg install/share/Pyra/libjpeg-turbo/
    - ldd install/bin/pyra_web_test | grep -F "libjpeg.so.8 => $CI_PROJECT_DIR/install/bin/../lib/"
    - install/bin/pyra_web_test --help
    - tar -czf "$BUNDLE" -C install .
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: junit.xml
    paths:
      - "$BUNDLE"

gui-linux:
  extends: .linux-build
  variables:
    EXTRA_PACKAGES: "qt6-base-dev"
    PYRA_OPTIONS: "-DPYRA_BUILD_GUI_TEST=ON -DPYRA_BUILD_WEB_TEST=OFF"

package-web:
  stage: package
  image:
    name: curlimages/curl:8.11.1
    entrypoint: [""]
  needs:
    - job: web-linux
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$BUNDLE" "$PACKAGE_URL"'

release-web:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - package-web
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "PyrA $CI_COMMIT_TAG"
    description: >-
      Linux x64 build of the localhost web viewer pyra_web_test (Ubuntu 24.04,
      GCC 13). Extract and run bin/pyra_web_test --root IMAGE_DIRECTORY.
      Needs the system packages libtiff6 and libopenjp2-7; libjpeg-turbo 3.1.3
      is bundled in lib/.
    assets:
      links:
        - name: "$BUNDLE"
          url: "$PACKAGE_URL"
          link_type: package
